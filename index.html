<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas Seguras Kids</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
   
    <div class="header-content">
        <div class="header-logo">
            <img src="img/logop.png" alt="Logo Rutas Seguras Kids" class="logo-img">
            <div>
                <h1>Rutas Seguras Kids</h1>
                <p>Sistema de gestión de rutas escolares</p>
            </div>
        </div>
        <div class="header-stats">
            <div class="stat">
                <span id="total-rutas">0</span>
                <small>Rutas</small>
            </div>
            <div class="stat">
                <span id="total-estudiantes">0</span>
                <small>Estudiantes</small>
            </div>
        </div>
    </div>


    </header>

    <main>
        <section id="formulario-section">
            <h2>Nueva Ruta</h2>
            <form id="ruta-form">
                <input type="text" id="input-nombre" placeholder="Nombre de la ruta">
                <input type="text" id="input-conductor" placeholder="Nombre del conductor "> 
                <input type="time" id="input-hora">
                <input type="text" id="input-ciudad" placeholder="Ciudad">
                <button type="button" id="btn-agregar-ruta">Agregar Ruta</button>
            </form>
        </section>

        <section id="rutas-section">
            <h2>Rutas Registradas</h2>
            <button class="btn-filtro activo" data-filtro="todas">Todas</button>
            <button class="btn-filtro" data-filtro="pendiente">Pendiente</button>
            <button class="btn-filtro" data-filtro="en-curso">En curso</button>
            <button class="btn-filtro" data-filtro="finalizada">Finalizada</button>
            <input type="text" id="buscador" placeholder="Buscar ruta...">
            <div id="contenedor-rutas">

            </div>
        </section>
    </main>


    <footer>
    <div class="footer-content">
        <span class="footer-logo">Rutas Seguras Kids</span>
        <span class="footer-copy">© 2026 Todos los derechos reservados</span>
    </div>
    </footer>

    
     <script src="js/components/route-card.js"></script>
    <script src="js/services/weatherService.js"></script>
    <script src="js/app.js"></script>


    
</body>
</html>
